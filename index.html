<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AcadFlow — Gestão de Atividades Complementares Acadêmicas" />
  <meta name="theme-color" content="#1a56db" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="pwa/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AcadFlow" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>AcadFlow — Atividades Complementares</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/animations.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <div id="app">
    <div id="page-loader" class="page-loader">
      <div class="loader-brand">
        <div class="loader-logo">
          <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
          <span class="logo-text">AcadFlow</span>
        </div>
        <div class="loader-bar"><div class="loader-bar-fill"></div></div>
      </div>
    </div>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <div id="modal-overlay" class="modal-overlay hidden"></div>
    <div id="modal-container"></div>
    <div id="shell" class="app-shell hidden">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="main-wrapper">
        <header id="navbar" class="navbar"></header>
        <main id="page-content" class="page-content"></main>
      </div>
    </div>
    <div id="auth-container"></div>
  </div>

  <!-- Utils -->
  <script src="utils/storage.js"></script>
  <script src="utils/helpers.js"></script>
  <script src="utils/validators.js"></script>
  <script src="utils/theme.js"></script>

  <!-- API layer -->
  <script src="services/api.js"></script>
  <script src="services/authService.js"></script>
  <script src="services/userService.js"></script>
  <script src="services/activityService.js"></script>
  <script src="services/dashboardService.js"></script>

  <!-- UI Components -->
  <script src="components/toast/toast.js"></script>
  <script src="components/loader/loader.js"></script>
  <script src="components/modal/modal.js"></script>
  <script src="components/sidebar/sidebar.js"></script>
  <script src="components/navbar/navbar.js"></script>
  <script src="components/table/table.js"></script>
  <script src="components/card/card.js"></script>

  <!-- Pages -->
  <script src="pages/login/login.js"></script>
  <script src="pages/superadmin/dashboard.js"></script>
  <script src="pages/superadmin/cursos.js"></script>
  <script src="pages/superadmin/curso-detalhe.js"></script>
  <script src="pages/superadmin/coordenadores.js"></script>
  <script src="pages/superadmin/alunos.js"></script>
  <script src="pages/coordenador/dashboard.js"></script>
  <script src="pages/coordenador/curso-detalhe.js"></script>
  <script src="pages/coordenador/categorias.js"></script>
  <script src="pages/coordenador/submissoes.js"></script>
  <script src="pages/coordenador/alunos.js"></script>
  <script src="pages/aluno/dashboard.js"></script>
  <script src="pages/aluno/submeter.js"></script>
  <script src="pages/aluno/historico.js"></script>
  <script src="pages/perfil/perfil.js"></script>

  <!-- Router + Bootstrap -->
  <script src="utils/router.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
